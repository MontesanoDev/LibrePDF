name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Modifica fondamentale: fetch-depth: 0 serve per scaricare tutta la cronologia,
      # altrimenti git log non riesce a trovare le differenze coi tag precedenti.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: Set version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./mvnw -B versions:set -DnewVersion=$v -DgenerateBackupPoms=false

      - name: Download JavaFX JMODS
        shell: pwsh
        run: |
          $url = "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_windows-x64_bin-jmods.zip"
          curl.exe -L -o jfx.zip $url
          Expand-Archive jfx.zip -DestinationPath jfx
          $jmods = (Get-ChildItem jfx -Directory | Select-Object -First 1).FullName
          "JAVAFX_JMODS=$jmods" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Shrink JRE (jlink)
        shell: pwsh
        run: |
          if (Test-Path dist\runtime) { Remove-Item -Recurse -Force dist\runtime }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          jlink `
            --module-path "$env:JAVA_HOME\jmods;$env:JAVAFX_JMODS" `
            --add-modules javafx.controls `
            --output dist\runtime `
            --strip-debug `
            --strip-native-commands `
            --no-header-files `
            --no-man-pages `
            --compress=zip-9

      - name: Build app-image (jpackage)
        shell: pwsh
        run: |
          if (Test-Path dist\input) { Remove-Item -Recurse -Force dist\input }
          New-Item -ItemType Directory -Force -Path dist\input | Out-Null
          Copy-Item "target\LibrePDF-$env:APP_VERSION.jar" dist\input\
          Copy-Item target\libs\*.jar dist\input\
          if (Test-Path dist\app-image) { Remove-Item -Recurse -Force dist\app-image }
          New-Item -ItemType Directory -Force -Path dist\app-image | Out-Null
          jpackage `
            --name LibrePDF `
            --input dist\input `
            --main-jar "LibrePDF-$env:APP_VERSION.jar" `
            --main-class it.leonardomontemurro.librepdf.App `
            --runtime-image dist\runtime `
            --type app-image `
            --vendor "Leonardo Montemurro" `
            --app-version "$env:APP_VERSION" `
            --dest dist\app-image

      - name: Zip portable + sha256
        shell: pwsh
        run: |
          $zip = "LibrePDF-$env:APP_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path dist\app-image\LibrePDF -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Out-File -Encoding ASCII "$zip.sha256" -NoNewline

      - name: Generate Release Notes with DeepSeek
        shell: pwsh
        run: |
          try {
            $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
            if ($prevTag) {
              $commits = git log "$prevTag..HEAD" --oneline
            } else {
              $commits = git log --oneline
            }
          } catch {
            $commits = "Initial updates."
          }
          
          $prompt = @"
          You are an expert software engineer writing a changelog for an open-source desktop app.

          STRICT FORMAT RULES (follow exactly):
          - Write in English only.
          - Group commits under section headers from this list when applicable: '## ✨ Features', '## 🐛 Bug Fixes', '## 🧹 Chores & Maintenance'.
          - Section headers MUST start with '## ' (two hash marks + space) so they render as H2 Markdown headings.
          - Every entry MUST be a top-level Markdown bullet starting with "- " (dash + space) at column 0, NEVER indented.
          - Each bullet MUST start with the short commit SHA (7-char hex from the input) followed by a space, then the description. Example: "- abc1234 Add flatten operation".
          - Copy the SHA exactly as it appears in the input. NEVER invent, alter, or shorten/extend SHAs — GitHub auto-links them only if they match real commits.
          - Do NOT nest bullets under other bullets. Bullets go directly under the section heading, not inside a list.
          - Use imperative present tense: "Add", "Fix", "Update" — NOT "Added", "Fixed", "Updated".
          - No trailing periods on bullet lines.
          - One bullet per commit, do not skip commits, do not merge two commits into one bullet.
          - Output ONLY the changelog itself. No preamble, no epilogue, no explanations, no code fences.

          EXAMPLE OF VALID OUTPUT (copy this structure exactly):
          ## ✨ Features
          - abc1234 Add flatten operation to make form fields static
          - def5678 Wire flatten operation to UI controller

          ## 🧹 Chores & Maintenance
          - 9876fed Add timeout and raw-commit fallback to release notes step

          Commits to summarize:
          $commits
          "@
          
          $headers = @{
            "Authorization" = "Bearer ${{ secrets.IA_SECRET_KEY }}"
            "Content-Type"  = "application/json"
          }
          
          $body = @{
            model = "deepseek-v4-flash"
            messages = @(
              @{ role = "user"; content = $prompt }
            )
          } | ConvertTo-Json -Depth 10 -Compress
          
          try {
            $response = Invoke-RestMethod -Uri "https://api.deepseek.com/chat/completions" -Method Post -Headers $headers -Body $body -TimeoutSec 30
            $ai_notes = $response.choices[0].message.content
            $disclaimer = "`n`n---`n*🤖 Disclaimer: This changelog was auto-generated by AI based on commit messages. Please excuse any inaccuracies.*"
          } catch {
            Write-Warning "DeepSeek API failed: $_. Falling back to raw commit list."
            $bullets = ($commits -split "`n" | Where-Object { $_ } | ForEach-Object { "- $_" }) -join "`n"
            $ai_notes = "### Changes`n`n$bullets"
            $disclaimer = "`n`n---`n*⚠️ Note: AI release note generation failed, showing raw commits as fallback.*"
          }

          $final_notes = $ai_notes + $disclaimer
          
          $final_notes | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            LibrePDF-*-windows-x64-portable.zip
            LibrePDF-*-windows-x64-portable.zip.sha256
          generate_release_notes: false

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: Set version from tag
        run: |
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Download JavaFX JMODS
        run: |
          set -e
          curl -fL -o jfx.zip "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_linux-x64_bin-jmods.zip"
          unzip -q jfx.zip -d jfx
          echo "JAVAFX_JMODS=$(ls -d jfx/*/ | head -1)" >> "$GITHUB_ENV"

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Shrink JRE (jlink)
        run: |
          set -e
          rm -rf dist/runtime
          mkdir -p dist
          jlink \
            --module-path "$JAVA_HOME/jmods:$JAVAFX_JMODS" \
            --add-modules javafx.controls \
            --output dist/runtime \
            --strip-debug \
            --strip-native-commands \
            --no-header-files \
            --no-man-pages \
            --compress=zip-9

      - name: Build app-image (jpackage)
        run: |
          set -e
          rm -rf dist/input
          mkdir -p dist/input
          cp "target/LibrePDF-${APP_VERSION}.jar" dist/input/
          cp target/libs/*.jar dist/input/
          rm -rf dist/app-image
          mkdir -p dist/app-image
          jpackage \
            --name LibrePDF \
            --input dist/input \
            --main-jar "LibrePDF-${APP_VERSION}.jar" \
            --main-class it.leonardomontemurro.librepdf.App \
            --runtime-image dist/runtime \
            --type app-image \
            --vendor "Leonardo Montemurro" \
            --app-version "$APP_VERSION" \
            --dest dist/app-image

      - name: Tar.gz portable + sha256
        run: |
          set -e
          TARBALL="LibrePDF-${APP_VERSION}-linux-x64-portable.tar.gz"
          tar -czf "$TARBALL" -C dist/app-image LibrePDF
          sha256sum "$TARBALL" > "${TARBALL}.sha256"

      - name: Upload Linux artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LibrePDF-*-linux-x64-portable.tar.gz
            LibrePDF-*-linux-x64-portable.tar.gz.sha256
          generate_release_notes: false