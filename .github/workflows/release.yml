name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Modifica fondamentale: fetch-depth: 0 serve per scaricare tutta la cronologia,
      # altrimenti git log non riesce a trovare le differenze coi tag precedenti.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      - name: Set version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download JavaFX JMODS
        shell: pwsh
        run: |
          $url = "https://download2.gluonhq.com/openjfx/25.0.3/openjfx-25.0.3_windows-x64_bin-jmods.zip"
          curl.exe -L -o jfx.zip $url
          Expand-Archive jfx.zip -DestinationPath jfx
          $jmods = (Get-ChildItem jfx -Directory | Select-Object -First 1).FullName
          "JAVAFX_JMODS=$jmods" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Shrink JRE (jlink)
        shell: pwsh
        run: |
          if (Test-Path dist\runtime) { Remove-Item -Recurse -Force dist\runtime }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          jlink `
            --module-path "$env:JAVA_HOME\jmods;$env:JAVAFX_JMODS" `
            --add-modules javafx.controls `
            --output dist\runtime `
            --strip-debug `
            --strip-native-commands `
            --no-header-files `
            --no-man-pages `
            --compress=zip-9

      - name: Build app-image (jpackage)
        shell: pwsh
        run: |
          if (Test-Path dist\input) { Remove-Item -Recurse -Force dist\input }
          New-Item -ItemType Directory -Force -Path dist\input | Out-Null
          Copy-Item target\LibrePDF-1.0-SNAPSHOT.jar dist\input\
          Copy-Item target\libs\*.jar dist\input\
          if (Test-Path dist\app-image) { Remove-Item -Recurse -Force dist\app-image }
          New-Item -ItemType Directory -Force -Path dist\app-image | Out-Null
          jpackage `
            --name LibrePDF `
            --input dist\input `
            --main-jar LibrePDF-1.0-SNAPSHOT.jar `
            --main-class it.leonardomontemurro.librepdf.App `
            --runtime-image dist\runtime `
            --type app-image `
            --vendor "Leonardo Montemurro" `
            --app-version "$env:APP_VERSION" `
            --dest dist\app-image

      - name: Zip portable + sha256
        shell: pwsh
        run: |
          $zip = "LibrePDF-$env:APP_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path dist\app-image\LibrePDF -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Out-File -Encoding ASCII "$zip.sha256" -NoNewline

      - name: Generate Release Notes with DeepSeek
        shell: pwsh
        run: |
          try {
            $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
            if ($prevTag) {
              $commits = git log "$prevTag..HEAD" --oneline
            } else {
              $commits = git log --oneline
            }
          } catch {
            $commits = "Initial updates."
          }
          
          $prompt = "You are an expert software engineer. Summarize the following commit messages into a professional changelog for an open-source app. You MUST write the output in English. Group the changes logically under standard changelog headings (e.g., '✨ Features', '🐛 Bug Fixes', '🧹 Chores & Maintenance'). Format it as a clean Markdown list. Do not add introductory or concluding remarks, output ONLY the changelog.`n`nCommits:`n$commits"
          
          $headers = @{
            "Authorization" = "Bearer ${{ secrets.IA_SECRET_KEY }}"
            "Content-Type"  = "application/json"
          }
          
          $body = @{
            model = "deepseek-v4-flash"
            messages = @(
              @{ role = "user"; content = $prompt }
            )
          } | ConvertTo-Json -Depth 10 -Compress
          
          $response = Invoke-RestMethod -Uri "https://api.deepseek.com/chat/completions" -Method Post -Headers $headers -Body $body
          $ai_notes = $response.choices[0].message.content
          
          $disclaimer = "`n`n---`n*🤖 Disclaimer: This changelog was auto-generated by AI based on commit messages. Please excuse any inaccuracies.*"
          $final_notes = $ai_notes + $disclaimer
          
          $final_notes | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            LibrePDF-*-windows-x64-portable.zip
            LibrePDF-*-windows-x64-portable.zip.sha256
          generate_release_notes: false